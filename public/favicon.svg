<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="recPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>
    <linearGradient id="recGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Clean Rounded Square with Purple Background -->
  <rect width="120" height="120" rx="26" fill="url(#recPurple)" />

  <!-- Subtle Gold Inner Border -->
  <rect x="4" y="4" width="112" height="112" rx="22" fill="none" stroke="url(#recGold)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Academic Torch & Stylized "R" Mark -->
  <!-- Torch Flame in Gold -->
  <path d="M 60 22 C 60 22, 69 33, 66 41 C 64 45, 60 48, 60 48 C 60 48, 56 45, 54 41 C 51 33, 60 22, 60 22 Z" fill="url(#recGold)" />
  <circle cx="60" cy="38" r="3" fill="#FEF3C7" />

  <!-- Stylized "R" Structure -->
  <!-- Left Stem -->
  <path d="M 40 45 L 49 45 L 49 95 L 40 95 Z" fill="#FFFFFF" />

  <!-- Upper Loop of "R" -->
  <path d="M 48 45 L 68 45 C 77 45, 82 50, 82 58 C 82 66, 76 71, 67 71 L 48 71 Z M 49 53 L 49 63 L 66 63 C 71 63, 73 61, 73 58 C 73 55, 71 53, 66 53 Z" fill="#FFFFFF" fill-rule="evenodd" />

  <!-- Right Dynamic Leg of "R" -->
  <path d="M 63 67 L 83 95 L 72 95 L 54 70 Z" fill="url(#recGold)" />

  <!-- Small Torch Bowl Base Accent -->
  <path d="M 52 48 L 68 48 L 64 53 L 56 53 Z" fill="url(#recGold)" />
</svg>